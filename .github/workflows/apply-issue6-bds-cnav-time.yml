name: Apply BDS CNAV time fix

on:
  push:
    branches:
      - issue-6-all-signal-residuals-bds-tgd
    paths:
      - tools/apply_issue6_bds_cnav_time_fix.py
      - tests/rinex4_bds_cnav/**
      - .github/workflows/apply-issue6-bds-cnav-time.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Draft branch
        uses: actions/checkout@v4
        with:
          ref: issue-6-all-signal-residuals-bds-tgd
          fetch-depth: 0

      - name: Apply guarded parser fix
        run: |
          python -m py_compile tools/apply_issue6_bds_cnav_time_fix.py
          python tools/apply_issue6_bds_cnav_time_fix.py
          git diff --check

      - name: BDS RINEX4 CNAV regression
        run: make -C tests/rinex4_bds_cnav clean test

      - name: GLONASS L3OC parser regression
        run: make -C tests/rinex4_glo_l3oc clean test

      - name: Signal bias regression
        run: make -C tests/signal_bias_ext clean test

      - name: Arbitrary-frequency residual regression
        run: make -C tests/residual_ext clean test

      - name: Standalone pntpos compile
        run: >-
          cc -O2 -std=c99 -Wall -Wextra -pedantic -I src
          -DENAGLO -DENAQZS -DENAGAL -DENACMP -DNFREQ=3
          -c src/pntpos.c -o /tmp/pntpos.o

      - name: Commit validated parser fix and remove scaffolding
        run: |
          rm -f tools/apply_issue6_bds_cnav_time_fix.py .github/workflows/apply-issue6-bds-cnav-time.yml
          make -C tests/rinex4_bds_cnav clean
          make -C tests/rinex4_glo_l3oc clean
          make -C tests/signal_bias_ext clean
          make -C tests/residual_ext clean
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --exit-code && { echo 'No validated parser changes to commit'; exit 1; } || true
          git commit -m 'Fix RINEX4 BeiDou CNAV ephemeris time'
          git push origin HEAD:issue-6-all-signal-residuals-bds-tgd
