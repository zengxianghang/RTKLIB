name: Apply GLONASS L3OC patch

on:
  push:
    branches:
      - issue-6-all-signal-residuals-bds-tgd
    paths:
      - tools/apply_issue6_glo_l3oc_patch.py
      - .github/workflows/apply-issue6-glo-l3oc.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Draft branch
        uses: actions/checkout@v4
        with:
          ref: issue-6-all-signal-residuals-bds-tgd
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Syntax-check guarded patch driver
        run: python -m py_compile tools/apply_issue6_glo_l3oc_patch.py

      - name: Apply guarded source and regression changes
        run: |
          python tools/apply_issue6_glo_l3oc_patch.py
          sed -i 's/expected_clk,1E-15/expected_clk,1E-14/' tests/residual_ext/test_glo_l3oc_residual.c
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/residual_ext/test_glo_l3oc_residual.c')
          s=p.read_text()
          s=s.replace('if (!sat) return 1;', 'if (!sat) { fprintf(stderr,"G3 satellite unavailable line=%d\\n",__LINE__); return 1; }')
          s=s.replace('if (stat!=1) return 1;', 'if (stat!=1) { fprintf(stderr,"G3 state stat=%d line=%d\\n",stat,__LINE__); return 1; }')
          s=s.replace('if (!(range>0.0)) return 1;', 'if (!(range>0.0)) { fprintf(stderr,"G3 geodist invalid line=%d range=%.15f\\n",__LINE__,range); return 1; }')
          s=s.replace('if (stat!=1||info.message_type!=NAV_L3OC||\n        !expect_close("G3 pilot code bias",bias,-CLIGHT*geph.isc_l3ocp,1E-9)) return 1;', 'if (stat!=1||info.message_type!=NAV_L3OC) { fprintf(stderr,"G3 bias status stat=%d type=%d line=%d\\n",stat,info.message_type,__LINE__); return 1; }\n    if (!expect_close("G3 pilot code bias",bias,-CLIGHT*geph.isc_l3ocp,1E-9)) return 1;')
          s=s.replace('    stat=rtklib_rescode_signal_ext(&obs,&nav,&opt,rr,0.0,0.0,NAV_L3OC,\n', '''    {
        double dbg_pos[3],dbg_azel[2],dbg_dion=0.0,dbg_vion=0.0,dbg_dtrp=0.0,dbg_vtrp=0.0;
        double dbg_e[3];
        double dbg_r=geodist(rs,rr,dbg_e);
        ecef2pos(rr,dbg_pos);
        satazel(dbg_pos,dbg_e,dbg_azel);
        fprintf(stderr,"G3 pre-code r=%.3f el=%.9f svh=%d exclude=%d ion=%d trop=%d\\n",
                dbg_r,dbg_azel[1],svh,satexclude(sat,svh,&opt),
                ionocorr(obs.time,&nav,sat,dbg_pos,dbg_azel,opt.ionoopt,&dbg_dion,&dbg_vion),
                tropcorr(obs.time,&nav,dbg_pos,dbg_azel,opt.tropopt,&dbg_dtrp,&dbg_vtrp));
    }
    stat=rtklib_rescode_signal_ext(&obs,&nav,&opt,rr,0.0,0.0,NAV_L3OC,
''')
          s=s.replace('if (stat!=1||info.message_type!=NAV_L3OC||\n        !expect_close("G3 truth-state code residual",residual,0.0,1E-4)) return 1;', 'if (stat!=1||info.message_type!=NAV_L3OC) { fprintf(stderr,"G3 code residual status stat=%d type=%d line=%d\\n",stat,info.message_type,__LINE__); return 1; }\n    if (!expect_close("G3 truth-state code residual",residual,0.0,1E-4)) return 1;')
          s=s.replace('if (stat!=1||!expect_close("G3 truth-state Doppler residual",residual,0.0,5E-4)) return 1;', 'if (stat!=1) { fprintf(stderr,"G3 Doppler residual status stat=%d line=%d\\n",stat,__LINE__); return 1; }\n    if (!expect_close("G3 truth-state Doppler residual",residual,0.0,5E-4)) return 1;')
          p.write_text(s)
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Build and run signal-bias regressions
        run: make -C tests/signal_bias_ext clean test

      - name: Build and run residual regressions
        run: make -C tests/residual_ext clean test

      - name: Build and run RINEX4 GLONASS L3OC parser regression
        run: make -C tests/rinex4_glo_l3oc clean test

      - name: Compile modified pntpos.c standalone
        run: >-
          cc -O2 -std=c99 -Wall -Wextra -pedantic
          -Isrc -DENAGLO -DENAQZS -DENAGAL -DENACMP -DNFREQ=3
          -c src/pntpos.c -o /tmp/pntpos.o

      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rtklib.h src/ephemeris.c src/rinex.c src/rtkcmn.c tests/signal_bias_ext tests/residual_ext tests/rinex4_glo_l3oc
          git diff --cached --exit-code && { echo 'No validated implementation changes to commit'; exit 1; } || true
          git commit -m 'Add GLONASS L3OC ISC residual support'
          git push origin HEAD:issue-6-all-signal-residuals-bds-tgd
