name: Finalize GLONASS L3OC patch

on:
  push:
    branches:
      - issue-6-all-signal-residuals-bds-tgd
    paths:
      - tools/apply_issue6_glo_family_unique_patch.py
      - .github/workflows/apply-issue6-glo-l3oc.yml

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Draft branch
        uses: actions/checkout@v4
        with:
          ref: issue-6-all-signal-residuals-bds-tgd
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply guarded family-retention review fix
        run: |
          python -m py_compile tools/apply_issue6_glo_family_unique_patch.py
          python tools/apply_issue6_glo_family_unique_patch.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Build and run signal-bias regressions
        run: make -C tests/signal_bias_ext clean test

      - name: Build and run residual regressions
        run: make -C tests/residual_ext clean test

      - name: Build and run same-epoch RINEX4 family regression
        run: make -C tests/rinex4_glo_l3oc clean test

      - name: Compile modified pntpos.c standalone
        run: >-
          cc -O2 -std=c99 -Wall -Wextra -pedantic
          -Isrc -DENAGLO -DENAQZS -DENAGAL -DENACMP -DNFREQ=3
          -c src/pntpos.c -o /tmp/pntpos.o

      - name: Remove generated binaries and one-time scaffolding
        run: |
          make -C tests/signal_bias_ext clean
          make -C tests/residual_ext clean
          make -C tests/rinex4_glo_l3oc clean
          rm -rf tools/__pycache__
          rm -f tools/apply_issue6_glo_l3oc_patch.py
          rm -f tools/apply_issue6_glo_family_unique_patch.py
          rm -f .github/workflows/apply-issue6-glo-l3oc.yml

      - name: Commit clean validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- src/rinex.c src/rtkcmn.c tests/signal_bias_ext tests/residual_ext tests/rinex4_glo_l3oc tools/apply_issue6_glo_l3oc_patch.py tools/apply_issue6_glo_family_unique_patch.py .github/workflows/apply-issue6-glo-l3oc.yml
          git diff --cached --check
          git diff --cached --exit-code && { echo 'No finalization changes to commit'; exit 1; } || true
          git commit -m 'Preserve same-epoch GLONASS navigation families'
          git push origin HEAD:issue-6-all-signal-residuals-bds-tgd
