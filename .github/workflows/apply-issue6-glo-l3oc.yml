name: Apply GLONASS L3OC patch

on:
  push:
    branches:
      - issue-6-all-signal-residuals-bds-tgd
    paths:
      - tools/apply_issue6_glo_l3oc_patch.py
      - .github/workflows/apply-issue6-glo-l3oc.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Draft branch
        uses: actions/checkout@v4
        with:
          ref: issue-6-all-signal-residuals-bds-tgd
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Syntax-check guarded patch driver
        run: python -m py_compile tools/apply_issue6_glo_l3oc_patch.py

      - name: Apply guarded source and regression changes
        run: |
          python tools/apply_issue6_glo_l3oc_patch.py
          sed -i 's/expected_clk,1E-15/expected_clk,1E-14/' tests/residual_ext/test_glo_l3oc_residual.c

      - name: Check patch whitespace
        run: git diff --check

      - name: Build and run signal-bias regressions
        run: make -C tests/signal_bias_ext clean test

      - name: Build and run residual regressions
        run: make -C tests/residual_ext clean test

      - name: Build and run RINEX4 GLONASS L3OC parser regression
        run: make -C tests/rinex4_glo_l3oc clean test

      - name: Compile modified pntpos.c standalone
        run: >-
          cc -O2 -std=c99 -Wall -Wextra -pedantic
          -Isrc -DENAGLO -DENAQZS -DENAGAL -DENACMP -DNFREQ=3
          -c src/pntpos.c -o /tmp/pntpos.o

      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rtklib.h src/ephemeris.c src/rinex.c src/rtkcmn.c tests/signal_bias_ext tests/residual_ext tests/rinex4_glo_l3oc
          git diff --cached --exit-code && { echo 'No validated implementation changes to commit'; exit 1; } || true
          git commit -m 'Add GLONASS L3OC ISC residual support'
          git push origin HEAD:issue-6-all-signal-residuals-bds-tgd
