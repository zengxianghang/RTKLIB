name: Validate diagnostic residual API

on:
  push:
    branches:
      - issue-6-all-signal-residuals-bds-tgd
    paths:
      - src/rtklib_residual_ext.c
      - src/rtklib_residual_ext.h
      - tests/residual_ext/test_residual_ext.c
      - .github/workflows/validate-diagnostic-residual.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-6-all-signal-residuals-bds-tgd
      - name: Signal bias regressions
        run: make -C tests/signal_bias_ext clean test
      - name: Residual regressions
        run: make -C tests/residual_ext clean test
      - name: RINEX4 GLONASS family regression
        run: make -C tests/rinex4_glo_l3oc clean test
      - name: Standalone pntpos compile
        run: >-
          cc -O2 -std=c99 -Wall -Wextra -pedantic
          -Isrc -DENAGLO -DENAQZS -DENAGAL -DENACMP -DNFREQ=3
          -c src/pntpos.c -o /tmp/pntpos.o
