name: issue6-validate

on:
  push:
    branches: [issue-6-all-signal-residuals-bds-tgd]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-6-all-signal-residuals-bds-tgd
          fetch-depth: 0
      - name: Bind legacy BDS TGD to legacy navigation family
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pntpos.c')
          s = p.read_text()
          old = '''        if (nav->eph[i].sat!=sat) continue;\n        age=fabs(timediff(nav->eph[i].toe,time));'''
          new = '''        if (nav->eph[i].sat!=sat) continue;\n        if (sys==SYS_CMP&&nav->eph[i].hdr.msg_type&&\n            !(nav->eph[i].hdr.msg_type&(NAV_D1|NAV_D2|NAV_D1D2))) continue;\n        age=fabs(timediff(nav->eph[i].toe,time));'''
          if old not in s:
              raise SystemExit('pntpos gettgd anchor not found')
          p.write_text(s.replace(old, new, 1))
      - name: Run BDS signal-bias tests
        run: make -C tests/signal_bias_ext clean test
      - name: Compile residual and pntpos sources
        run: |
          mkdir -p /tmp/issue6-obj
          CFLAGS='-O2 -std=c99 -Wall -Wextra -pedantic -Isrc -DENAGLO -DENAQZS -DENAGAL -DENACMP -DNFREQ=3'
          gcc $CFLAGS -c src/rtklib_signal_bias_ext.c -o /tmp/issue6-obj/signal_bias.o
          gcc $CFLAGS -c src/rtklib_residual_ext.c -o /tmp/issue6-obj/residual.o
          gcc $CFLAGS -c src/pntpos.c -o /tmp/issue6-obj/pntpos.o
      - name: Commit validated source patch and remove helper workflow
        run: |
          rm .github/workflows/issue6_validate.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: restrict legacy BeiDou TGD selection by message family'
          git push origin HEAD:issue-6-all-signal-residuals-bds-tgd
