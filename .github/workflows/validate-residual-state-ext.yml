name: Validate residual extension draft

on:
  push:
    branches: [issue-6-all-signal-residuals-bds-tgd]

permissions:
  contents: read

jobs:
  residual-ext:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and run residual extension tests
        run: make -C tests/residual_ext clean test
