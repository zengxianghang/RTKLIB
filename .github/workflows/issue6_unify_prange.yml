name: issue6-unify-prange

on:
  push:
    branches: [issue-6-all-signal-residuals-bds-tgd]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-6-all-signal-residuals-bds-tgd
          fetch-depth: 0
      - name: Apply current shared-prange patch
        run: echo '' | base64 -d | python3
      - name: Build and test
        run: |
          set -euxo pipefail
          make -C tests/signal_bias_ext clean all
          ./tests/signal_bias_ext/test_signal_bias_ext
          cc -std=c99 -I src -DENAGLO -DENAGAL -DENAQZS -DENACMP -c src/rtklib_signal_bias_ext.c -o /tmp/rtklib_signal_bias_ext.o
          cc -std=c99 -I src -DENAGLO -DENAGAL -DENAQZS -DENACMP -c src/rtklib_residual_ext.c -o /tmp/rtklib_residual_ext.o
          cc -std=c99 -I src -DENAGLO -DENAGAL -DENAQZS -DENACMP -c src/pntpos.c -o /tmp/pntpos.o
          git diff --check
      - name: Commit validated source and remove helper workflow
        run: |
          set -euxo pipefail
          git rm .github/workflows/issue6_unify_prange.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pntpos.c src/rtklib_signal_bias_ext.c src/rtklib_signal_bias_ext.h src/rtklib_residual_ext.c src/rtklib_residual_ext.h tests/signal_bias_ext/test_signal_bias_ext.c
          git commit -m "fix: unify single-frequency broadcast code bias handling"
          git push origin HEAD:issue-6-all-signal-residuals-bds-tgd
