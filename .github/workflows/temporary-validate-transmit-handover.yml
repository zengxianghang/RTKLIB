name: Temporary validate transmit-epoch handover fix

on:
  push:
    branches:
      - issue-6-all-signal-residuals-bds-tgd

permissions:
  contents: write

jobs:
  validate-and-remove-self:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: issue-6-all-signal-residuals-bds-tgd
          fetch-depth: 0

      - name: Run RTKLIB extension regressions
        shell: bash
        run: |
          set -euo pipefail
          make -C tests/signal_bias_ext clean test
          make -C tests/residual_ext clean test
          make -C tests/rinex4_bds_cnav clean test
          make -C tests/rinex4_glo_l3oc clean test

      - name: Remove temporary workflow after success
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-validate-transmit-handover.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temporary-validate-transmit-handover.yml
          git commit -m "ci: remove temporary transmit-handover validation"
          git push origin HEAD:issue-6-all-signal-residuals-bds-tgd
