name: issue6-verify

on:
  push:
    branches:
      - issue-6-all-signal-residuals-bds-tgd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test signal bias extension
        run: make -C tests/signal_bias_ext clean test
      - name: Test residual extension
        run: make -C tests/residual_ext clean test
      - name: Compile pntpos
        run: |
          gcc -std=c99 -Wall -Wextra -pedantic -Isrc -DENAGLO -DENAQZS -DENAGAL -DENACMP -DNFREQ=3 -c src/pntpos.c -o /tmp/pntpos.o
