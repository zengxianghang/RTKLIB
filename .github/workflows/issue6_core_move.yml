name: issue6-core-move

on:
  push:
    branches: [issue-6-all-signal-residuals-bds-tgd]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-6-all-signal-residuals-bds-tgd
          fetch-depth: 0

      - name: Move signal bias helper into RTKLIB core
        run: echo '' | base64 -d | python3

      - name: Validate extension and standard app linkage
        run: |
          set -euxo pipefail
          make -C tests/signal_bias_ext clean all
          ./tests/signal_bias_ext/test_signal_bias_ext
          cc -std=c99 -I src -DENAGLO -DENAGAL -DENAQZS -DENACMP -c src/rtklib_residual_ext.c -o /tmp/rtklib_residual_ext.o
          cc -std=c99 -I src -DENAGLO -DENAGAL -DENAQZS -DENACMP -c src/pntpos.c -o /tmp/pntpos.o
          make -C app/rnx2rtkp/gcc clean
          make -C app/rnx2rtkp/gcc
          git diff --check

      - name: Commit validated core move and remove helper workflow
        run: |
          set -euxo pipefail
          git rm .github/workflows/issue6_core_move.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rtkcmn.c src/rtklib_signal_bias_ext.c src/rtklib_signal_bias_ext.h src/rtklib_residual_ext.c src/rtklib_residual_ext.h tests/signal_bias_ext/makefile
          git commit -m "refactor: share signal bias helper through RTKLIB core"
          git push origin HEAD:issue-6-all-signal-residuals-bds-tgd
