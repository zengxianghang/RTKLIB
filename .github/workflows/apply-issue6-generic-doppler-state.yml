name: Apply generic Doppler state selector

on:
  push:
    branches:
      - issue-6-all-signal-residuals-bds-tgd
    paths:
      - tools/apply_issue6_generic_doppler_state.py
      - .github/workflows/apply-issue6-generic-doppler-state.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Draft branch
        uses: actions/checkout@v4
        with:
          ref: issue-6-all-signal-residuals-bds-tgd
          fetch-depth: 0

      - name: Apply guarded patch
        run: |
          python -m py_compile tools/apply_issue6_generic_doppler_state.py
          python tools/apply_issue6_generic_doppler_state.py
          git diff --check

      - name: Run signal-bias regressions
        run: make -C tests/signal_bias_ext clean test

      - name: Run arbitrary-frequency residual regressions
        run: make -C tests/residual_ext clean test

      - name: Standalone compile pntpos
        run: cc -std=c99 -Wall -Wextra -pedantic -Isrc -DENAGLO -DENAQZS -DENAGAL -DENACMP -DNFREQ=3 -c src/pntpos.c -o /tmp/pntpos.o

      - name: Commit validated implementation
        run: |
          rm -f tools/apply_issue6_generic_doppler_state.py .github/workflows/apply-issue6-generic-doppler-state.yml
          make -C tests/signal_bias_ext clean
          make -C tests/residual_ext clean
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --exit-code && { echo 'No validated implementation changes to commit'; exit 1; } || true
          git commit -m 'Allow generic broadcast state for unconstrained Doppler'
          git push origin HEAD:issue-6-all-signal-residuals-bds-tgd
